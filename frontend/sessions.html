<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Manage your learning session requests and peer schedule on CampusSkillConnect.">
  <title>Session Requests — CampusSkillConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-layout">

  <!-- ========================================================================
       Sidebar Navigation
       ======================================================================== -->
  <aside class="app-sidebar">
    <div class="sidebar-header">
      <a href="dashboard.html" class="brand-logo">
        <span class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </span>
        <span>SkillConnect</span>
      </a>
    </div>

    <!-- Authenticated Student Mini Card -->
    <div class="sidebar-user">
      <div class="sidebar-avatar" data-user-avatar>?</div>
      <div style="min-width: 0;">
        <div class="sidebar-user-name" data-user-name>Loading...</div>
        <div class="sidebar-user-role" data-user-dept>Student</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <ul style="display: flex; flex-direction: column; gap: 4px;">
        <li class="nav-item">
          <a href="dashboard.html" class="nav-menu-link" data-page="dashboard">
            <span class="nav-menu-icon">📊</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="skills.html" class="nav-menu-link" data-page="skills">
            <span class="nav-menu-icon">💡</span>
            <span>Manage Skills</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="matches.html" class="nav-menu-link" data-page="matches">
            <span class="nav-menu-icon">🤝</span>
            <span>Find Matches</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="sessions.html" class="nav-menu-link" data-page="sessions">
            <span class="nav-menu-icon">📅</span>
            <span>Session Requests</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="profile.html" class="nav-menu-link" data-page="profile">
            <span class="nav-menu-icon">👤</span>
            <span>Student Profile</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-menu-link" style="width: 100%; border: none; text-align: left;" data-action="logout">
        <span class="nav-menu-icon">🚪</span>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- ========================================================================
       Main Content Area
       ======================================================================== -->
  <div class="app-main">
    <header class="app-topbar">
      <div class="topbar-left">
        <button class="mobile-toggle" id="mobile-sidebar-toggle" aria-label="Toggle Sidebar Menu">☰</button>
        <div>
          <h1 class="topbar-title">Manage Session Requests</h1>
          <div class="topbar-subtitle">Track, accept, and schedule peer learning appointments</div>
        </div>
      </div>

      <div class="topbar-right">
        <a href="matches.html" class="btn btn-primary btn-sm">
          ＋ Request New Session
        </a>
        <button class="backend-indicator" id="backend-indicator" title="Backend Server Status">
          <span class="backend-dot" id="backend-dot"></span>
          <span id="backend-text">Connecting...</span>
        </button>
      </div>
    </header>

    <main class="app-content">

      <!-- Alert Box -->
      <div id="sessions-alert-area"></div>

      <!-- Tab Filter Controls -->
      <div class="tab-list" id="sessions-tab-list">
        <button class="tab-btn active" data-filter="all">All Sessions (<span id="count-all">0</span>)</button>
        <button class="tab-btn" data-filter="pending">Pending (<span id="count-pending">0</span>)</button>
        <button class="tab-btn" data-filter="accepted">Accepted / Upcoming (<span id="count-accepted">0</span>)</button>
        <button class="tab-btn" data-filter="completed">Completed (<span id="count-completed">0</span>)</button>
        <button class="tab-btn" data-filter="rejected">Declined / Cancelled (<span id="count-other">0</span>)</button>
      </div>

      <!-- Sessions Container (Strictly populated via real API) -->
      <div id="sessions-list-container">
        <div class="loading-box">
          <div class="spinner"></div>
          <p class="text-sm text-secondary">Loading session records from backend API...</p>
        </div>
      </div>

    </main>
  </div>

  <script src="js/app.js?v=2"></script>
  <script>
    if (requireAuth()) {
      initAppLayout('sessions');

      let allSessions = [];
    let currentFilter = 'all';

    async function loadSessions() {
      const container = document.getElementById('sessions-list-container');
      const alertContainer = document.getElementById('sessions-alert-area');

      renderLoadingState(container, 'Fetching session requests from backend...');
      alertContainer.innerHTML = '';

      const result = await apiFetch('/sessions');

      if (!result.success) {
        renderErrorState(container, {
          message: result.error || 'Unable to connect to backend server at ' + getApiBase(),
          onRetry: loadSessions
        });
        return;
      }

      // Backend returned real sessions
      allSessions = Array.isArray(result.data) ? result.data : (result.data.sessions || []);
      updateTabCounters();
      renderFilteredSessions();
    }

    function updateTabCounters() {
      const pendingCount = allSessions.filter(s => (s.status || '').toLowerCase() === 'pending').length;
      const acceptedCount = allSessions.filter(s => (s.status || '').toLowerCase() === 'accepted').length;
      const completedCount = allSessions.filter(s => (s.status || '').toLowerCase() === 'completed').length;
      const otherCount = allSessions.filter(s => {
        const st = (s.status || '').toLowerCase();
        return st === 'rejected' || st === 'cancelled' || st === 'declined';
      }).length;

      document.getElementById('count-all').textContent = allSessions.length;
      document.getElementById('count-pending').textContent = pendingCount;
      document.getElementById('count-accepted').textContent = acceptedCount;
      document.getElementById('count-completed').textContent = completedCount;
      document.getElementById('count-other').textContent = otherCount;
    }

    function renderFilteredSessions() {
      const container = document.getElementById('sessions-list-container');
      const currentUser = getAuthUser() || {};
      const currentUserId = currentUser._id || currentUser.id || currentUser.email;

      let filtered = allSessions;
      if (currentFilter === 'pending') {
        filtered = allSessions.filter(s => (s.status || '').toLowerCase() === 'pending');
      } else if (currentFilter === 'accepted') {
        filtered = allSessions.filter(s => (s.status || '').toLowerCase() === 'accepted');
      } else if (currentFilter === 'completed') {
        filtered = allSessions.filter(s => (s.status || '').toLowerCase() === 'completed');
      } else if (currentFilter === 'rejected') {
        filtered = allSessions.filter(s => {
          const st = (s.status || '').toLowerCase();
          return st === 'rejected' || st === 'cancelled' || st === 'declined';
        });
      }

      if (filtered.length === 0) {
        renderEmptyState(container, {
          title: `No ${currentFilter === 'all' ? '' : currentFilter.toUpperCase()} Sessions Found`,
          message: 'There are no session records matching this status.',
          actionText: 'Explore Compatible Matches',
          actionLink: 'matches.html'
        });
        return;
      }

      let html = '<div style="display: flex; flex-direction: column; gap: 16px;">';

      filtered.forEach(session => {
        const id = session._id || session.id;
        const status = (session.status || 'pending').toLowerCase();
        const skillName = session.skillName || (session.skill ? session.skill.name : 'Peer Exchange');
        const proposedDate = session.proposedDate || session.date || 'Date not set';
        const proposedTime = session.proposedTime || session.time || '';
        const mode = session.mode || 'In-person';
        const message = session.message || session.notes || '';

        // Determine if user is sender or receiver
        const isRequester = session.requesterId === currentUserId || session.senderId === currentUserId || session.isRequester;
        const partnerName = session.partnerName || (isRequester ? (session.receiverName || 'Peer Tutor') : (session.senderName || 'Peer Learner'));
        const partnerDept = session.partnerDept || session.department || 'Student';
        const role = session.role || (isRequester ? 'You are Learning' : 'You are Teaching');

        html += `
          <div class="card" style="padding: 22px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px;">
              <div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                  <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary);">${escapeHtml(skillName)}</h3>
                  <span class="badge ${role.includes('Teaching') ? 'badge-accent' : 'badge-info'}">${escapeHtml(role)}</span>
                </div>
                <div class="text-xs text-secondary">
                  Partner: <strong>${escapeHtml(partnerName)}</strong> (${escapeHtml(partnerDept)})
                </div>
              </div>

              <span class="status-pill ${status}">
                <span class="status-dot"></span>
                ${escapeHtml(status.toUpperCase())}
              </span>
            </div>

            <!-- Schedule & Location Details -->
            <div style="background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 14px; display: flex; gap: 24px; flex-wrap: wrap; font-size: 0.88rem;">
              <div>
                <span class="text-muted">📅 Date:</span>
                <strong>${escapeHtml(formatDate(proposedDate))}</strong>
              </div>
              <div>
                <span class="text-muted">⏰ Time:</span>
                <strong>${escapeHtml(formatTime(proposedTime))}</strong>
              </div>
              <div>
                <span class="text-muted">📍 Location:</span>
                <strong>${escapeHtml(mode)}</strong>
              </div>
            </div>

            ${message ? `
              <div class="text-xs text-secondary" style="margin-bottom: 16px; font-style: italic;">
                "${escapeHtml(message)}"
              </div>
            ` : ''}

            <!-- Contextual Actions -->
            <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-light); padding-top: 14px;">
        `;

        if (status === 'pending') {
          if (!isRequester) {
            // User is the receiver: can accept or decline
            html += `
              <button class="btn btn-outline btn-sm btn-session-action" data-id="${escapeHtml(id)}" data-action="rejected">
                ✕ Decline
              </button>
              <button class="btn btn-success btn-sm btn-session-action" data-id="${escapeHtml(id)}" data-action="accepted">
                ✓ Accept Request
              </button>
            `;
          } else {
            // User is the requester: can cancel their own request
            html += `
              <button class="btn btn-outline btn-sm btn-session-action" data-id="${escapeHtml(id)}" data-action="cancelled">
                Cancel Request
              </button>
            `;
          }
        } else if (status === 'accepted') {
          html += `
            <button class="btn btn-primary btn-sm btn-session-action" data-id="${escapeHtml(id)}" data-action="completed">
              ✓ Mark as Completed
            </button>
          `;
        }

        html += `
            </div>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;

      // Attach action listeners
      container.querySelectorAll('.btn-session-action').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const sessionId = e.currentTarget.getAttribute('data-id');
          const newStatus = e.currentTarget.getAttribute('data-action');
          await updateSessionStatus(sessionId, newStatus);
        });
      });
    }

    async function updateSessionStatus(sessionId, status) {
      if (!sessionId || !status) return;

      const result = await apiFetch(`/sessions/${sessionId}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });

      if (result.success) {
        showToast(`Session request updated to ${status}.`, 'success');
        loadSessions();
      } else {
        showToast(result.error || 'Failed to update session status on backend.', 'error');
      }
    }

    // Tab filter click handlers
    document.getElementById('sessions-tab-list').addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;

      document.querySelectorAll('#sessions-tab-list .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter') || 'all';
      renderFilteredSessions();
    });

      window.refreshCurrentPageData = loadSessions;
      loadSessions();
    }
  </script>
</body>
</html>
